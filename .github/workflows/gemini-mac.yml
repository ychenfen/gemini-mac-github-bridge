name: Gemini Mac run
run-name: Gemini Mac run #${{ github.event.issue.number }}

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: gemini-mac-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[gemini-run]') &&
      (
        (github.event_name == 'issues' && github.event.issue.user.login == github.repository_owner) ||
        (github.event_name == 'issue_comment' && github.event.comment.user.login == github.repository_owner && startsWith(github.event.comment.body, '/run'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Verify trusted actor
        env:
          ACTOR: ${{ github.actor }}
          TRIGGER: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          test "$ACTOR" = "$OWNER"
          test "$TRIGGER" = "$OWNER"

  run:
    needs: authorize
    runs-on: [self-hosted, macOS, ARM64, mac-bridge]
    timeout-minutes: 130
    defaults:
      run:
        shell: bash --noprofile --norc -e "{0}"
    steps:
      - name: Execute command on Mac and reply to issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          RUN_ID: ${{ github.run_id }}
          RUNNER_NAME: ${{ runner.name }}
        run: |
          python3 - <<'PYEOF'
          import datetime, json, os, re, subprocess, time

          BT3 = chr(96) * 3
          BT4 = chr(96) * 4

          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["REPO"]
          event_name = os.environ.get("EVENT_NAME", "issues")
          issue_number = os.environ["ISSUE_NUMBER"]
          token = os.environ["GH_TOKEN"]
          raw_body = os.environ.get("COMMENT_BODY", "") if event_name == "issue_comment" else os.environ.get("ISSUE_BODY", "")
          body = (raw_body or "").strip()
          if event_name == "issue_comment" and body.startswith("/run"):
              body = body[4:].strip()
          run_id = os.environ.get("RUN_ID", "")
          runner_name = os.environ.get("RUNNER_NAME", "")

          workdir, timeout_minutes, command = "~", 30, ""
          files_to_read, chunk_output, keep_open = [], False, (event_name == "issue_comment")

          parsed = None
          json_match = re.search(BT3 + r"json\s*(\{.*\})\s*" + BT3, body, re.S)
          if json_match:
              try:
                  parsed = json.loads(json_match.group(1))
              except Exception:
                  parsed = None
          elif body.startswith("{"):
              try:
                  parsed = json.loads(body)
              except Exception:
                  parsed = None

          if isinstance(parsed, dict) and ("command" in parsed or "files" in parsed):
              command = str(parsed.get("command") or "")
              workdir = str(parsed.get("workdir") or "~")
              try:
                  timeout_minutes = int(parsed.get("timeout_minutes") or 30)
              except Exception:
                  timeout_minutes = 30
              if isinstance(parsed.get("files"), list):
                  files_to_read = [str(x) for x in parsed["files"] if str(x).strip()]
              chunk_output = bool(parsed.get("chunk_output", False))
              if "keep_open" in parsed:
                  keep_open = bool(parsed.get("keep_open"))
          else:
              wd_match = re.search(r"(?im)^workdir:\s*(.+)$", body)
              if wd_match:
                  workdir = wd_match.group(1).strip()
              tm_match = re.search(r"(?im)^timeout_minutes:\s*(\d+)$", body)
              if tm_match:
                  timeout_minutes = int(tm_match.group(1))
              fence_match = re.search(BT3 + r"(?:zsh|bash|sh)?\s*\n(.*)" + BT3, body, re.S)
              command = fence_match.group(1).strip() if fence_match else body

          timeout_minutes = max(1, min(120, timeout_minutes))
          expanded_dir = os.path.expanduser(workdir or "~")

          env = os.environ.copy()
          extra_path = "/opt/homebrew/bin:/usr/local/bin:/Applications/Docker.app/Contents/Resources/bin"
          env["PATH"] = f"{extra_path}:{env.get('PATH', '')}"
          env["LANG"] = "en_US.UTF-8"
          env["LC_ALL"] = "en_US.UTF-8"
          env["PYTHONIOENCODING"] = "utf-8"
          env.pop("GH_TOKEN", None)

          started, timed_out = time.monotonic(), False
          if not command and not files_to_read:
              code, output = 2, "[gemini-mac] Empty command and files in payload."
          elif not os.path.isdir(expanded_dir):
              code, output = 2, f"[gemini-mac] Working directory not found: {expanded_dir}"
          elif command:
              try:
                  proc = subprocess.run(
                      ["/bin/zsh", "-l", "-c", command],
                      cwd=expanded_dir,
                      env=env,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      errors="replace",
                      timeout=timeout_minutes * 60,
                  )
                  code, output = proc.returncode, proc.stdout or ""
              except subprocess.TimeoutExpired as exc:
                  timed_out, code = True, 124
                  partial = exc.stdout or ""
                  if isinstance(partial, bytes):
                      partial = partial.decode("utf-8", errors="replace")
                  output = f"{partial}\n[gemini-mac] Timed out after {timeout_minutes} minutes."
          else:
              code, output = 0, ""

          if files_to_read:
              secret_hints = ("credential", "secret", "password", "token", "cookie", "id_rsa", "id_ed25519")
              secret_ext = (".pem", ".key", ".p12", ".pfx", ".kdbx")
              file_blocks = []
              for item in files_to_read[:10]:
                  fp = os.path.expanduser(item)
                  if not os.path.isabs(fp):
                      fp = os.path.join(expanded_dir, fp)
                  base = os.path.basename(fp).lower()
                  if base == ".env" or base.startswith(".env.") or base.endswith(secret_ext) or any(h in base for h in secret_hints):
                      file_blocks.append(f"=== FILE: {fp} [SKIPPED: sensitive name] ===")
                      continue
                  if not os.path.isfile(fp):
                      file_blocks.append(f"=== FILE: {fp} [NOT FOUND] ===")
                      continue
                  try:
                      with open(fp, "r", encoding="utf-8", errors="replace") as fh:
                          data = fh.read(40000)
                      file_blocks.append(f"=== FILE: {fp} ===\n{data}")
                  except Exception as exc:
                      file_blocks.append(f"=== FILE: {fp} [ERROR: {exc}] ===")
              if file_blocks:
                  output = (output.rstrip() + "\n\n" if output.strip() else "") + "\n\n".join(file_blocks)

          duration = round(time.monotonic() - started, 2)
          finished_at = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          def gh_api(method, path, payload):
              subprocess.run(
                  [
                      "curl", "-fsSL", "-X", method,
                      "-H", f"Authorization: Bearer {token}",
                      "-H", "Accept: application/vnd.github+json",
                      "-H", "Content-Type: application/json",
                      "-H", "X-GitHub-Api-Version: 2022-11-28",
                      "--data-binary", "@-",
                      f"{api}{path}",
                  ],
                  input=json.dumps(payload),
                  text=True,
                  check=True,
              )

          timeout_tag = " (timed out)" if timed_out else ""
          if chunk_output and len(output) > 54000:
              chunks = [output[i:i+54000] for i in range(0, min(len(output), 162000), 54000)]
              truncated = len(output) > 162000
              for idx, part in enumerate(chunks, 1):
                  fence = BT4 if BT3 in part else BT3
                  header = f"### Gemini Mac Run Result (Part {idx}/{len(chunks)})\n"
                  meta = (
                      f"- **Status**: `exit_code={code}`{timeout_tag}\n"
                      f"- **Runner**: `{runner_name}` | **Duration**: `{duration}s` | **Run ID**: `{run_id}`\n"
                      f"- **Workdir**: `{expanded_dir}` | **Finished (UTC)**: `{finished_at}`\n"
                  ) if idx == 1 else ""
                  note = "- **Note**: Output capped at 3 chunks (162,000 chars).\n" if (idx == len(chunks) and truncated) else ""
                  body_md = f"{header}{meta}{note}\n{fence}text\n{part.rstrip()}\n{fence}\n"
                  gh_api("POST", f"/repos/{repo}/issues/{issue_number}/comments", {"body": body_md})
          else:
              truncated = False
              if len(output) > 56000:
                  truncated = True
                  output = output[:12000] + "\n\n... [truncated middle] ...\n\n" + output[-42000:]
              fence = BT4 if BT3 in output else BT3
              note_line = "- **Note**: Output truncated (pass chunk_output: true for up to 3 chunks).\n" if truncated else ""
              body_md = (
                  "### Gemini Mac Run Result\n"
                  f"- **Status**: `exit_code={code}`{timeout_tag}\n"
                  f"- **Runner**: `{runner_name}` | **Duration**: `{duration}s` | **Run ID**: `{run_id}`\n"
                  f"- **Workdir**: `{expanded_dir}` | **Finished (UTC)**: `{finished_at}`\n"
                  f"{note_line}\n"
                  f"{fence}text\n{output.rstrip()}\n{fence}\n"
              )
              gh_api("POST", f"/repos/{repo}/issues/{issue_number}/comments", {"body": body_md})

          if not keep_open:
              gh_api("PATCH", f"/repos/{repo}/issues/{issue_number}", {"state": "closed", "state_reason": "completed"})

          if code != 0:
              raise SystemExit(code)
          PYEOF
